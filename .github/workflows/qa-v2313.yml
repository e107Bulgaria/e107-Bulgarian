name: QA e107 Bulgarian v2.3.13

on:
  push:
    branches:
      - feature/e107-v2.3.13
    paths:
      - ".github/workflows/qa-v2313.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD

      - name: PHP syntax check
        run: |
          set -e
          for f in \
            e107_languages/Bulgarian/Bulgarian.php \
            e107_languages/Bulgarian/admin/lan_admin.php \
            e107_languages/Bulgarian/admin/lan_banlist.php \
            e107_languages/Bulgarian/admin/lan_cpage.php \
            e107_languages/Bulgarian/admin/lan_db.php \
            e107_languages/Bulgarian/admin/lan_image.php \
            e107_languages/Bulgarian/admin/lan_links.php \
            e107_languages/Bulgarian/admin/lan_theme.php \
            e107_languages/Bulgarian/admin/lan_upload.php \
            e107_languages/Bulgarian/lan_search.php \
            e107_languages/Bulgarian/lan_signup.php \
            e107_languages/Bulgarian/lan_usersettings.php \
            e107_plugins/banner/languages/Bulgarian_admin.php
          do
            php -l "$f"
          done

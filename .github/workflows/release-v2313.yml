name: Publish Bulgarian e107 v2.3.13 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v2313.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release notes
        run: |
          cat > /tmp/release-v2313.md <<'EOF'
          Професионален български езиков пакет за e107 CMS v2.3.13.

          ## Включва

          - Пълен български превод на e107 core
          - Пълен превод на административната част
          - Превод на публичната част на сайта
          - Превод на инсталатора
          - Преводи на стандартните bundled плъгини
          - Езикови ресурси за стандартните bundled теми
          - Български езиков descriptor с `compatibility="2.3.13"`
          - Българска legacy help документация в `e107_docs/help/Bulgarian`

          ## Обновено за e107 v2.3.13

          Тази версия актуализира българския езиков пакет от e107 v2.3.12 до e107 v2.3.13.

          При директното сравнение на официалните upstream тагове `v2.3.12 → v2.3.13` са отчетени **611 upstream commits**.

          Промените по езиковите ресурси включват:

          - **13 променени съществуващи language ресурса**
          - **70 нови активни `define()` константи**
          - няма добавени или премахнати language файлове

          ### Основни промени

          - нови core текстове за logout confirmation, sanitisation и security проверки;
          - нови административни съобщения за Site URL и Multi-Site/site-folder миграция;
          - разширени съобщения за CSV import в Ban List, включително validation, duplicates, rollback и logging;
          - нови Multi-Site и Site folders инструменти в Database Tools;
          - нови проверки за файлове извън Media/Avatars директориите;
          - predefined links и поддръжка на `{E_TOKEN}` в Link Manager;
          - нови Theme и Upload validation съобщения;
          - нови текстове за advanced search, повторно изпращане на activation email и account deletion;
          - допълнени административни текстове за bundled плъгина Banner.

          ## Покритие на превода

          - 35 основни PHP езикови файла
          - 44/44 core admin language файла
          - 28/28 PHP admin help файла
          - 85 езикови файла на стандартните bundled плъгини
          - 4 езикови файла на стандартните bundled теми
          - общо 196 PHP езикови/help файла
          - 21 legacy help документа в `e107_docs`

          ## Проверка на качеството

          - сравнение с официалните English езикови ресурси на e107 v2.3.13;
          - active `define()` key parity за всички 13 засегнати ресурса;
          - липсващи ключове: 0;
          - допълнителни ключове: 0;
          - `git diff --check`: PASS;
          - `php -l`: PASS за всички 13 променени PHP файла;
          - placeholders, shortcodes, HTML и BBCode маркери са запазени;
          - `Bulgarian.xml` е обновен до `compatibility="2.3.13"`.

          Преводът е базиран на официалните English езикови ресурси на e107 v2.3.13.

          Legacy help файловете в `e107_docs` са преведени от последната официална upstream версия, която все още ги съдържа — e107 v2.1.9.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force
          gh release create v2.3.13 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Български езиков пакет за e107 CMS v2.3.13" \
            --notes-file /tmp/release-v2313.md \
            --latest

      - name: Remove temporary workflow
        run: |
          git config user.name "e107Bulgaria automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/release-v2313.yml
          git commit -m "chore: clean up v2.3.13 release automation"
          git push origin HEAD:main
